name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # gcpit-tech/sustainomics is the only deployer: it alone holds the
    # RAILWAY_TOKEN secret. The mirror remote (yogi100x/sustainomics) runs the
    # same workflow, so skip there instead of failing on a missing secret and
    # instead of racing two builds into the same Railway project.
    if: github.repository == 'gcpit-tech/sustainomics'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Project token (RAILWAY_TOKEN) scopes deploy to this project/environment.
      # Create via GraphQL projectTokenCreate or dashboard → Project → Settings → Tokens.
      # Add as GitHub secret RAILWAY_TOKEN on gcpit-tech/sustainomics.
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "Missing secret RAILWAY_TOKEN (Railway project token for production)."
            exit 1
          fi
          # Project token already identifies project + environment; pin the service.
          railway up --service web --ci --message "gha ${GITHUB_SHA::7}"

      - name: Smoke test public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://web-production-e769d.up.railway.app}"
          echo "Waiting for $SITE_URL ..."
          OK=""
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              OK=1
              echo "Homepage OK ($CODE)"
              break
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          if [ -z "$OK" ]; then
            echo "Smoke test failed: homepage not healthy at $SITE_URL"
            exit 1
          fi
